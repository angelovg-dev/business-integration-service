services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: business_integration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/business_integration
      DB_PASSWORD: postgres
    depends_on:
      - db

volumes:
  pgdata: